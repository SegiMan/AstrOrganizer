[project]
name = "astrorganizer"
version = "0.1.0"
description = "A tabbed, tag-aware file organizer for Linux."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "AstrOrganizer contributors"}]
dependencies = [
  "PySide6>=6.7",
  "send2trash>=1.8",
  "psutil>=5.9",
  "platformdirs>=4.0"
]

[project.scripts]
astrorganizer = "astrorganizer.app:main"
